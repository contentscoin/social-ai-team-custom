name: Build desktop installers

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
            artifact: 'desktop/dist/*.exe'
            artifact_name: windows
          - os: macos-latest
            flags: --mac --arm64
            artifact: 'desktop/dist/*.dmg'
            artifact_name: macos
          - os: ubuntu-latest
            flags: --linux --x64
            artifact: 'desktop/dist/*.AppImage'
            artifact_name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Ensure icon exists
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            echo "icon.png missing — create a placeholder before packaging"
            exit 1
          fi
          ls -la assets/icon.png

      - name: Install dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build installer (no publish — avoid matrix race)
        working-directory: desktop
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List dist output
        working-directory: desktop
        shell: bash
        run: ls -la dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: social-ai-team-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        working-directory: desktop
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: social-ai-team-*
          merge-multiple: true

      - name: Show downloaded assets
        run: find release-assets -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Social AI Team v${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.yml
            release-assets/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
