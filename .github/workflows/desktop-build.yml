name: Build desktop installers

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 배포 전 게이트 — lib 테스트가 깨지면 인스톨러를 만들지 않는다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # lib 모듈은 순수 Node — 의존성 설치 없이 내장 test runner로 실행
      - name: Run tests
        working-directory: desktop
        run: npm test

  build:
    needs: test
    # PR에서는 테스트만 — 릴리스 업로드가 있는 빌드는 main 푸시/수동 실행에서만
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      # Serialize publishes so release asset uploads don't race
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
            glob: |
              desktop/dist/*.exe
              desktop/dist/*.yml
              desktop/dist/*.blockmap
          - os: macos-15
            flags: --mac --arm64
            glob: |
              desktop/dist/*.dmg
              desktop/dist/*.yml
              desktop/dist/*.blockmap
              desktop/dist/*.zip
          - os: ubuntu-latest
            flags: --linux --x64
            glob: |
              desktop/dist/*.AppImage
              desktop/dist/*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Ensure icon exists
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p assets
          test -f assets/icon.png
          ls -la assets/icon.png

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer (no Actions artifacts — quota workaround)
        working-directory: desktop
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Read version
        id: ver
        working-directory: desktop
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: List dist output
        working-directory: desktop
        shell: bash
        run: ls -lah dist || true

      # Skip actions/upload-artifact (account hit Actions artifact storage quota).
      # Upload straight to GitHub Releases instead.
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Social AI Team v${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ matrix.glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
